schema_version = 1
experiment = "hand_value_shaping"
description = "HP shaping と HP + learned Hand Value shaping の paired comparison"

[pairing]
variants = ["hand_value"]
seeds = [42, 43, 44, 45, 46]
primary_seed = 42
require_clean_worktree = true
only_intended_difference = "学習済みHandValueModelを使うpotential項（shape_hand=0.2）"

[training]
num_envs = 1000
total_timesteps = 5000000
lr = 5.845e-5
n_steps = 256
batch_size = 2048
n_epochs = 10
target_kl = 0.03
ent_coef = 0.01
clip_range = 0.3
gamma = 0.995

[ppo_inherited_defaults]
gae_lambda = 0.95
clip_range_vf = "none"
normalize_advantage = true
vf_coef = 0.5
max_grad_norm = 0.5
policy_mlp_pi = [64, 64]
policy_mlp_vf = [64, 64]
activation = "Tanh"
orthogonal_initialization = true

[reward_shaping]
shape_hp = 0.2
shape_mp = 0.0
shape_money = 0.0
shape_hand = 0.0
hand_value_model_dir = "runs/hand_value_model"
hand_value_clip_value = 1.0

[network]
use_transformer = true
feature_extractor = "GodFieldTransformerExtractor"
d_model = 192
nhead = 8
num_layers = 4
dim_feedforward = 768
features_dim = 256
grad_checkpointing = false
amp = true

[opponent]
kind = "strategic"
self_play = false

[evaluation]
tool = "tools/evaluate.py"
opponent = "strategic"
games_per_seat = 3000
num_envs = 512
seed_offset_from_training = 10000
both_seats = true
deterministic = true
amp = true
reward_shaping = false

[logging]
tensorboard = true
wandb = false
wandb_project = "godfield-rl-hand-value-shaping"
artifact_root = "runs/hand_value_shaping"

tracked_metrics = [
  "win_rate/recent_win",
  "win_rate/overall",
  "train/explained_variance",
  "train/value_loss",
  "train/policy_gradient_loss",
  "train/entropy_loss",
  "train/approx_kl",
  "train/clip_fraction",
  "time/fps",
]
