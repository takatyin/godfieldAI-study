[project]
name = "godfield-rl"
version = "0.1.0"
description = "GodField AI with Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.28.1",
    "numpy>=1.21.0",
    "stable-baselines3>=2.0.0",
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []
